<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro - Komi</title>
    <link href="../css/registro.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Sansita+Swashed:wght@300..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato:300,400">
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <div class="logo">
                <img src="../assets/images/registro_img/logo3.jpg" alt="Logo Komi">
                <span>Komi</span>
            </div>
            <div class="image-container">
                <img src="../assets/images/registro_img/fondo.jpg" alt="Imagen de comida" class="food-image">
            </div>
        </div>
        
        <div class="form-section">
            <h1>Register Now!</h1>
            <p class="subtitle">to be a part of us</p>
            <p class="instruction">Fill the information carefully</p>
            
            <form>
                <h2>Personal Information</h2>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="first-name">First name <span class="required">*</span></label>
                        <input type="text" id="first-name" placeholder="Enter your first name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="last-name">Last Name <span class="required">*</span></label>
                        <input type="text" id="last-name" placeholder="Enter your last name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="mobile">Mobile Number <span class="required">*</span></label>
                        <input type="tel" id="mobile" placeholder="Enter mobile number" required>
                    </div>
                </div>
                
                <div class="form-group full-width">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group full-width">
                    <label for="address1">Address 1</label>
                    <input type="text" id="address1" placeholder="Enter registration code">
                </div>
                
                <div class="form-group full-width">
                    <label for="address2">Address 2</label>
                    <input type="text" id="address2" placeholder="Enter registration code">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" id="city" placeholder="Enter city">
                    </div>
                    
                    <div class="form-group">
                        <label for="country">Country</label>
                        <input type="text" id="country" placeholder="Enter country">
                    </div>
                    
                    <div class="form-group">
                        <label for="zip">ZIP code</label>
                        <input type="text" id="zip" placeholder="Enter ZIP code">
                    </div>
                </div>
                
                <div class="button-container">
                    <button type="submit" class="next-button">Next</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
